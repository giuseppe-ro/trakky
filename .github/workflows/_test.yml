name: _test

on:
  workflow_call:

jobs:
  Client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: trakky-client/package-lock.json

      - name: Test Client
        working-directory: trakky-client
        run: |
          npm ci
          npm run lint
          npm run build --if-present
          npx vitest run --coverage

  Server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: trakky-server/package-lock.json

      - name: Test Server
        working-directory: trakky-server
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          npm test
